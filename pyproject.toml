[project]
name = "pytest-twister"
description = "Plugin for pytest to run Zephyr tests"
readme = "README.rst"
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Posix :: Linux",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "GitPython>=3.1.30",
  "PyYAML>=5.1",
  "filelock>=3.9.0",
  "marshmallow>=3.19.0",
  "ply>=3.11",
  "psutil>=5.9.4",
  "pyserial>=3.5",
  "pytest~=7.0.0",
  "pytest-subtests>=0.9.0",
  "tabulate>=0.9.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zephyrproject-rtos/twister"

[project.scripts]
twister_tools = "twister2.scripts.__main__:main"

[project.entry-points.pytest11]
twister = "twister2.plugin"

[dependency-groups]
doc = [
  "sphinx>=7.1.2",
  "sphinx-autodoc-typehints>=2.0.1",
  "sphinx-docstring-typing>=0.0.4",
  "sphinx-rtd-theme>=3.0.2",
]
lint = [
  "flake8>=5.0.4",
  "isort>=5.13.2",
  "mypy>=1.14.1",
  "types-pyyaml>=6.0.12.20241230",
  "types-tabulate>=0.9.0.20241207",
]
test = [
  "pytest-cov>=5.0.0",
  "pytest-rerunfailures>=13.0",
  "pytest-split>=0.2.0",
  "pytest-xdist>=3.6.1",
]

[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
filter_files = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
ignore_missing_imports = true
exclude = ["parsetab.py"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.setuptools.dynamic]
version = { attr = "twister2.__version__" }
